[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chp-server"
version = "0.60.2"
description = "Independently installable reference CHP server: assembles chp-core plus optional attachments behind truthful feature negotiation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Project Auxo, Inc." }]
keywords = ["chp", "capability-host-protocol", "server", "governance", "evidence"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
]
# THE dependency rule (docs 34/38, DEC-SRV-001): chp-core is the ONLY mandatory
# CHP dependency. Optional CHP packages attach via the chp_server.ports entry-point
# group; adding a NEW package here needs an approved decision. `chp-core[schema]` is
# still one CHP dependency (chp-core) — the [schema] extra pulls jsonschema so the
# server ENFORCES declared input schemas out of the box. Enforcement is the server's
# whole point (a protocol lib may leave it optional; a governed server must not), so a
# base `pip install chp-server` honors the README's "malformed calls are denied" promise
# rather than silently no-op'ing validation. Floor = 0.60.2: the release that adds the
# @capability(infer_schema=) parameter CapabilityServer relies on (a <0.60.2 core raises
# TypeError on import of any decorated capability).
dependencies = ["chp-core[schema]>=0.60.2"]

[project.urls]
Homepage = "https://github.com/capabilityhostprotocol/chp-server"
Issues = "https://github.com/capabilityhostprotocol/chp-server/issues"

[project.scripts]
chp-server = "chp_server.cli:main"

# Built-in attachment providers, discovered like any external ones — the server
# treats its own ports and third-party ports identically (doc 35).
[project.entry-points."chp_server.ports"]
local_standalone = "chp_server.local:LocalStandalonePorts"
local_artifacts = "chp_server.local:LocalArtifactPort"
entry_point_introduction = "chp_server.introduction:EntryPointIntroductionPort"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Import the IN-TREE chp_server, never a shadowing editable install. chp-server is
# editable-installed (a plain .pth appending the MAIN chp-dev checkout to sys.path),
# so a `git worktree` running these tests could otherwise import the main-checkout
# copy instead of its own source — uncommitted package changes would test as flaky,
# order-dependent pass/fail. `pythonpath = ["."]` is resolved relative to this
# rootdir and PREPENDED to sys.path, so the local source always wins regardless of
# CWD (the main checkout resolves to the identical path — no behavior change there).
pythonpath = ["."]
